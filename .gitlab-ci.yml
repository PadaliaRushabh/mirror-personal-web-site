# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

image: 
  name: node:18-alpine 

variables:
  NODE_ENV: 'dev'
  TS_NODE_PROJECT: './tsconfig.json'
 

before_script:
  - apk add --no-cache curl unzip python3 py3-pip groff less
  - pip3 install --upgrade pip --break-system-packages
  - pip3 install awscli --break-system-packages
  - npm install

stages:
  - build
  - deploy-certificate
  - hostedzone
  - deploy-website-dev
  - deploy-website-tst
  - deploy-website-prd


build-job:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - npm run build

# Deploy CertificateStack only when pushing to main
deploy-certificate:
  stage: deploy-certificate
  needs:
    - build-job
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
  script:
    - echo "Deploying CertificateStack"
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - | 
      npx cdk deploy CertificateStack \
      --context ENVIRONMENT=prd \
      --context DEPLOY_TARGET=certificate \
      --require-approval never

hostedzone-precheck:
  stage: hostedzone
  variables:
    DOMAIN_NAME: "rushabhpadalia.me"
  script:
    - |
      echo "Checking if hosted zone exists for $DOMAIN_NAME"
      ZONE_ID=$(aws route53 list-hosted-zones-by-name \
        --dns-name "$DOMAIN_NAME" \
        --query "HostedZones[?Name == '${DOMAIN_NAME}.'] | [0].Id" \
        --output text)
      echo "ZONE_ID=$ZONE_ID"
      if [ "$ZONE_ID" = "None" ]; then
        echo "CREATE_ZONE=true" >> zone.env
        echo "ZONE_ID=" >> zone.env
      else
        echo "CREATE_ZONE=false" >> zone.env
        echo "ZONE_ID=$ZONE_ID" >> zone.env
      fi
  artifacts:
    reports:
      dotenv: zone.env
    expire_in: 1 hour

deploy-zone:
  stage: hostedzone
  needs:
    - build-job
    - hostedzone-precheck
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
  script:
    - echo "Checking whether to deploy hosted zone..."
    - |
      if [ "$CREATE_ZONE" != "true" ]; then
        echo "Hosted zone already exists. Skipping deployment."
        exit 0
      fi
    - echo "Deploying ZoneStack"
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - |
      npx cdk deploy ZoneStack \
      --context ENVIRONMENT=prd \
      --context DEPLOY_TARGET=zone \
      --require-approval never

deploy-dev:
  stage: deploy-website-dev
  needs:
    - deploy-zone
  script:
    - echo "Deploying to DEV with CREATE_ZONE=$CREATE_ZONE, ZONE_ID=$ZONE_ID"
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - |
      npx cdk deploy PersonalWebSiteStack-$ENVIRONMENT \
      --require-approval never \
      --context ENVIRONMENT=$ENVIRONMENT \
      --context BUCKET_NAME=$BUCKET_NAME \
      --context DOMAIN_NAME=$DOMAIN_NAME \
      --context DEPLOY_TARGET=website \
      --context CREATE_HOSTED_ZONE=$CREATE_ZONE \
      --context HOSTED_ZONE_ID=$ZONE_ID \
      --context CERTIFICATE_ARN=$(aws ssm get-parameter --name /shared/certificate/arn --region us-east-1 --query 'Parameter.Value' --output text)
  variables:
    ENVIRONMENT: "dev"
    BUCKET_NAME: "pws-dev"
    DOMAIN_NAME: "dev.rushabhpadalia.me"
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^fe\//'

deploy-tst:
  stage: deploy-website-tst
  needs:
    - deploy-certificate
    - deploy-zone
  script:
    - echo "Deploying to TST with CREATE_ZONE=$CREATE_ZONE, ZONE_ID=$ZONE_ID"
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - |
      npx cdk deploy PersonalWebSiteStack-$ENVIRONMENT \
      --require-approval never \
      --context ENVIRONMENT=$ENVIRONMENT \
      --context BUCKET_NAME=$BUCKET_NAME \
      --context DOMAIN_NAME=$DOMAIN_NAME \
      --context DEPLOY_TARGET=website \
      --context CREATE_HOSTED_ZONE=$CREATE_ZONE \
      --context HOSTED_ZONE_ID=$ZONE_ID \
      --context CERTIFICATE_ARN=$(aws ssm get-parameter --name /shared/certificate/arn --region us-east-1 --query 'Parameter.Value' --output text)
  variables:
    ENVIRONMENT: "tst"
    BUCKET_NAME: "pws-staging"
    DOMAIN_NAME: "staging.rushabhpadalia.me"
  environment:
    name: tst
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-prd:
  stage: deploy-website-prd
  needs:
    - deploy-certificate
    - deploy-zone
    - deploy-tst
  script:
    - echo "Deploying to PRD with CREATE_ZONE=$CREATE_ZONE, ZONE_ID=$ZONE_ID"
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - |
      npx cdk deploy PersonalWebSiteStack-$ENVIRONMENT \
      --require-approval never \
      --context ENVIRONMENT=$ENVIRONMENT \
      --context BUCKET_NAME=$BUCKET_NAME \
      --context DOMAIN_NAME=$DOMAIN_NAME \
      --context DEPLOY_TARGET=website \
      --context CREATE_HOSTED_ZONE=$CREATE_ZONE \
      --context HOSTED_ZONE_ID=$ZONE_ID \
      --context CERTIFICATE_ARN=$(aws ssm get-parameter --name /shared/certificate/arn --region us-east-1 --query 'Parameter.Value' --output text)
  variables:
    ENVIRONMENT: "prd"
    BUCKET_NAME: "pws-prd"
    DOMAIN_NAME: 'rushabhpadalia.me,www.rushabhpadalia.me'
  environment:
    name: prd
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
