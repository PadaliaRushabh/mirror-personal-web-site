# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

image: node:18-alpine

variables:
  NODE_ENV: 'dev'
  TS_NODE_PROJECT: './tsconfig.json'


before_script:
  - npm install

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - npm run build


unit-test-job:   # This job runs in the test stage.
  stage: test
  image: python:3.10  # Specify the base Docker image with Python installed
  before_script:
    - python -V  # Display Python version for debugging purposes
    - pip install --upgrade pip  # Upgrade pip to the latest version
    - pip install tox  # Install tox
  script:
    - tox  # Run tox to execute the tests
  artifacts:
    when: always
    paths:
      - .tox/  # Store the Tox environment and results as artifacts
    expire_in: 1 week  # Define how long artifacts should be kept

# Job to run CDK tests
cdk_test:
  stage: test
  before_script:
    - npm install -g aws-cdk  # Install AWS CDK globally
    - npm install  # Install dependencies
  script:
    - npm run build  # Compile TypeScript to JavaScript (if applicable)
    - npm test  # Run tests
  artifacts:
    when: always
    paths:
      - coverage/  # If you generate coverage reports
    expire_in: 1 week

deploy-job: # This job runs in the deploy stage.
  stage: deploy
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - npx cdk deploy --context ENVIRONMENT=$ENVIRONMENT -require-approval never
  environment:
    name: $CI_ENVIRONMENT_NAME
  rules:
  - if: '$CI_COMMIT_BRANCH == "main"'
    variables:
      ENVIRONMENT: "prd"
      CI_ENVIRONMENT_NAME: "prd"
  - if: '$CI_COMMIT_BRANCH != "main"'
    variables:
      ENVIRONMENT: "dev"
      CI_ENVIRONMENT_NAME: "dev"
