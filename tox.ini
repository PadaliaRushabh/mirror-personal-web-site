[tox]
envlist =  python3, py310, lint

[testenv]
deps =
    pytest
    boto3
    moto[s3]>=5
    -r resources/lambdas/photo_gallery/requirements.txt
commands = pytest tests/lambdas

[testenv:lint]
description = run linters
skip_install = true
deps =
    pylint
    boto3
    pytest
    moto[s3]>=5
    -r resources/lambdas/photo_gallery/requirements.txt
commands = pylint tests/lambdas resources/lambdas
